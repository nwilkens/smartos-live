[package]
name = "vmadm"
version = "0.1.0"
edition.workspace = true
description = "Native Rust drop-in for the SmartOS vmadm CLI (bhyve + joyent-minimal), over the tritond-vmadm engine"

[lints]
workspace = true

[[bin]]
name = "vmadm"
path = "src/main.rs"

[dependencies]
tritond-vmadm = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
