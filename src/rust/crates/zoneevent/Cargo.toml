[package]
name = "zoneevent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust drop-in for the SmartOS zoneevent CLI: emits one JSON line per zone state transition from the com.sun:zones:status sysevent channel"

[lints]
workspace = true

[[bin]]
name = "zoneevent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
