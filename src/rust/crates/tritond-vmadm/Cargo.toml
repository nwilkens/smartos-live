[package]
name = "tritond-vmadm"
version = "0.1.0"
edition.workspace = true
description = "Native Rust replacement for the SmartOS node.js vmadm: drives zonecfg/zoneadm/zfs to create and manage bhyve + joyent-minimal zones"

[lints]
workspace = true

[lib]
name = "tritond_vmadm"
path = "src/lib.rs"

[dependencies]
tritond-cn-platform = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ipnetwork = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
