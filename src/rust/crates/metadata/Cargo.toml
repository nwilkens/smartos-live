[package]
name = "metadata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust replacement for the SmartOS node metadata agent: serves the mdata V1/V2 line protocol on per-zone unix sockets (OS zones) and the bhyve/kvm com2 serial socket (HVM), sourcing VM objects from vminfod"

[lints]
workspace = true

[[bin]]
name = "metadata"
path = "src/main.rs"

[[bin]]
name = "mdata-probe"
path = "src/bin/mdata_probe.rs"

[lib]
name = "metadata"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
