[package]
name = "fwadm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust drop-in for the SmartOS fwadm CLI: fwrule DSL parser/serializer, rule model, /var/fw store, and the ipf compiler/apply layer"

[lints]
workspace = true

[[bin]]
name = "fwadm"
path = "src/main.rs"

[lib]
name = "fwadm"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ipnetwork = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
