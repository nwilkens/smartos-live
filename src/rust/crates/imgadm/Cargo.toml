thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
sha1 = { workspace = true }
fd-lock = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
