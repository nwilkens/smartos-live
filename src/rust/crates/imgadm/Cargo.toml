[package]
name = "imgadm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust drop-in for the SmartOS imgadm CLI (zone-dataset + zvol image management)"

[lints]
workspace = true

[[bin]]
name = "imgadm"
path = "src/main.rs"

[dependencies]
imgapi-manifest = { workspace = true }
