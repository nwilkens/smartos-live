[package]
name = "vminfo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust drop-in for the SmartOS vminfo CLI: ping/status/vms/vm/events against the vminfod daemon on 127.0.0.1:9090"

[lints]
workspace = true

[[bin]]
name = "vminfo"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
