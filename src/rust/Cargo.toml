# Self-contained Rust workspace for the SmartOS platform image. Replaces
# every Node.js tool in the PI with a native illumos binary built here.
# Crates are added per phase (see NODE_ERADICATION_PLAN.md); crates.io
# deps are vendored under vendor/ so the platform build is hermetic.

[workspace]
resolver = "2"
members = [
    "crates/tritond-cn-platform",
    "crates/tritond-vmadm",
    "crates/vmadm",
    "crates/json",
    "crates/bunyan",
    "crates/disklayout",
    "crates/mkzpool",
    "crates/filewait",
    "crates/zoneevent",
    "crates/ntp_config",
    "crates/add-userscript",
    "crates/vminfod",
    "crates/vminfo",
    "crates/metadata",
    "crates/vmadmd",
    "crates/fwadm",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

# Lints reproduced verbatim from the vnext workspace so lifted crates
# compile and lint unchanged.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Centralized dependency versions. Lifted crates declare
# `dep = { workspace = true }`; versions match the vnext source of truth.
[workspace.dependencies]
# intra-workspace (path) crates
tritond-cn-platform = { path = "crates/tritond-cn-platform" }
tritond-vmadm = { path = "crates/tritond-vmadm" }

# crates.io
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ipnetwork = { version = "0.21", default-features = false, features = ["serde"] }
libc = "0.2"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
# preserve_order is load-bearing: json/bunyan/add-userscript reproduce
# node's object key ordering, which requires insertion-order maps.
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
# JS expression evaluation for `json -e`/`-c` (the only consumer).
boa_engine = "0.20"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tempfile = "3"
# vminfod HTTP daemon + client stack.
axum = "0.8"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
futures = "0.3"

# Release binaries ship in the PI; abort keeps them small and avoids
# unwinding through the illumos C boundary. The test profile keeps the
# default unwind harness automatically.
[profile.release]
panic = "abort"
strip = true
# Optimize PI binaries for size: -Oz, whole-program LTO, single codegen
# unit. Slower to build, but these ship in the platform image.
opt-level = "z"
lto = true
codegen-units = 1
